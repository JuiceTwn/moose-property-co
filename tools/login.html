<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Login — Moose Property Co.</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--white:#f6f4ef;--pure:#ffffff;--ink:#1c1a17;--olive:#555c3a;--stone:#a89c86;--soft:#6f685c;--line:rgba(28,26,23,.13)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Hanken Grotesk',sans-serif;background:var(--white);color:var(--ink);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}

  .login-nav{position:sticky;top:0;z-index:50;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .login-nav .inner{max-width:1100px;margin:0 auto;padding:0 32px;height:78px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:42px;height:39px;background:url(../moose-ink.png) center/contain no-repeat;display:inline-block}
  .brand .wm{display:flex;flex-direction:column;line-height:1}
  .brand .wm b{font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:18px}
  .brand .wm small{font-weight:600;letter-spacing:.28em;font-size:9px;color:var(--soft);margin-top:4px}
  .back-link{font-size:14px;font-weight:600;color:var(--soft);display:flex;align-items:center;gap:6px;transition:color .2s}
  .back-link:hover{color:var(--ink)}

  .login-page{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .login-card{background:var(--pure);border:1px solid var(--line);border-radius:10px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(28,26,23,.07)}
  .login-card h1{font-size:22px;font-weight:800;color:#2e2b23;margin-bottom:6px}
  .login-card .sub{font-size:15px;color:var(--soft);margin-bottom:32px;display:block}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-bottom:6px}
  .field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:4px;font-family:'Hanken Grotesk',sans-serif;font-size:16px;background:var(--white);color:var(--ink);outline:none;transition:border-color .2s}
  .field input:focus{border-color:var(--olive)}
  .login-btn{width:100%;background:var(--ink);color:var(--white);font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px;padding:15px;border:none;border-radius:3px;cursor:pointer;transition:background .25s;margin-top:10px}
  .login-btn:hover{background:var(--olive)}
  .login-err{background:#fde8e8;border:1px solid #e0c0c0;border-radius:4px;padding:12px 14px;font-size:14px;color:#8b2020;margin-top:14px;display:none}
  @media(max-width:480px){.login-card{padding:36px 24px}}
</style>
</head>
<body>

<header class="login-nav">
  <div class="inner">
    <a href="../index.html" class="brand">
      <span class="logo"></span>
      <span class="wm"><b>Moose</b><small>Property Co.</small></span>
    </a>
    <a href="../index.html" class="back-link">← Back to site</a>
  </div>
</header>

<main class="login-page">
  <div class="login-card">
    <h1>Team login</h1>
    <span class="sub">Access tools &amp; documents.</span>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Log in</button>
      <div class="login-err" id="login-err">Incorrect username or password.</div>
    </form>
  </div>
</main>

<script>
if (localStorage.getItem('mpc_auth')) {
  window.location.replace('dashboard.html');
}

var USERS = [
  { name: 'justin', pass: 'admin' },
  { name: 'chase',  pass: 'admin' }
];

document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var username = document.getElementById('username').value.trim().toLowerCase();
  var password = document.getElementById('password').value;
  var err = document.getElementById('login-err');
  err.style.display = 'none';
  var match = USERS.filter(function(u) { return u.name === username && u.pass === password; })[0];
  if (match) {
    localStorage.setItem('mpc_auth', '1');
    window.location.href = 'dashboard.html';
  } else {
    err.style.display = 'block';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
